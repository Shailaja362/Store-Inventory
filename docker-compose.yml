# The MySQL credentials below are owned by this compose file, not pulled
# from your local .env — that file is for running the app directly on your
# host, and whatever's in DB_USERNAME/DB_PASSWORD there might not survive
# round-tripping through env_file cleanly (quoting, special characters).
# Everything else (APP_KEY, MAIL_*, etc.) still comes from .env.
x-db-credentials: &db-credentials
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: store_inventory
  DB_USERNAME: store_inventory
  DB_PASSWORD: secret

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: store-inventory:latest
  env_file:
    - .env
  environment:
    <<: *db-credentials

services:
  # Runs migrations once and exits. Both `app` and `queue` wait for this to
  # finish successfully before they start, so there's no race between the
  # web process and the queue worker over who migrates the schema first.
  migrate:
    <<: *app-image
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "migrate", "--force", "--seed"]
    networks:
      - store-inventory

  app:
    <<: *app-image
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - store-inventory

  # Order creation dispatches a queued job (the confirmation "email"), so it
  # needs a worker actually running to be processed. Same image as `app`,
  # just running `queue:work` instead of Apache.
  queue:
    <<: *app-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    networks:
      - store-inventory

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: store_inventory
      MYSQL_USER: store_inventory
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
    # Not published to the host by default — app/queue reach it over the
    # internal network as `db:3306`. Uncomment if you want to connect a
    # local MySQL client to it directly, and watch for port clashes with
    # a MySQL already running on your machine.
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - store-inventory

volumes:
  db-data:

networks:
  store-inventory:
    driver: bridge
